font=Terminus:size=15
use-bold=yes
prompt="> "
icon-theme=Papirus Icon Theme
icons-enabled=yes
terminal=foot -e

anchor=center
x-margin=0
y-margin=0
lines=8
# minimal-lines=no
width=22
# tabs=8
horizontal-pad=15
vertical-pad=10
inner-pad=2

layer=overlay
keyboard-focus=exclusive
exit-on-keyboard-focus-loss=yes
enable-mouse=yes

[colors]
background=1f2335cc
text=c0caf5ff
match=2ac3deff
selection=363d59ff
selection-match=2ac3deff
selection-text=c0caf5ff
border=29a4bdff

[border]
width=2
radius=0